[project]
name = "cqnasa"
version = "0.1.0"
description = "Send NASA images to QQ groups via OneBot (NapCat)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
cqnasa = "cqnasa.__main__:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "black>=26.10.1",
]
